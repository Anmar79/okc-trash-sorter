# Apache 2.4.47+: forward https://<server>/quizblast/ to the QuizBlast app on port 3000.
# Needs: mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_headers
#   (Debian/Ubuntu: sudo a2enmod proxy proxy_http proxy_wstunnel headers)
# Put this inside your existing <VirtualHost *:443> block, then reload Apache.

RequestHeader set X-Forwarded-Proto "https"
ProxyPreserveHost On
ProxyPass        /quizblast/ http://127.0.0.1:3000/quizblast/ upgrade=websocket
ProxyPassReverse /quizblast/ http://127.0.0.1:3000/quizblast/
RedirectMatch ^/quizblast$ /quizblast/
