<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1d6f42" />
<title>OKC Trash Sorter</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="/game.css" />
<style>
  :root{
    --blue:#1c6fd6; --blue-dark:#134f9c;
    --green:#1d8f4f; --green-dark:#146637;
    --amber:#c97b0e; --amber-dark:#8f5a08;
    --red:#c0392b; --red-dark:#8c281c;
    --gray:#5b6470; --gray-dark:#3e4550;
    --ink:#1a1d21; --paper:#f7f7f5; --card:#ffffff; --line:#e4e2dd;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  header{ width:100%; max-width:480px; text-align:center; margin-bottom:18px; }
  header h1{ font-size:1.35rem; margin:0 0 4px; }
  header p{ margin:0; color:#666; font-size:0.9rem; }
  .card{
    width:100%; max-width:480px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:18px; margin-bottom:16px;
  }
  #preview-wrap{
    width:100%; aspect-ratio: 4/3; border-radius:12px; overflow:hidden;
    background:#eee; display:flex; align-items:center; justify-content:center;
    border:1px dashed #ccc; margin-bottom:14px; position:relative;
  }
  #preview-wrap img{ width:100%; height:100%; object-fit:cover; }
  #preview-placeholder{ color:#8a8a8a; font-size:0.9rem; padding:0 20px; text-align:center; }
  .row{ display:flex; gap:10px; }
  button{
    font:inherit; font-weight:600; border:none; border-radius:12px; padding:14px 16px;
    cursor:pointer; font-size:1rem; flex:1; transition:opacity .15s;
  }
  button:disabled{ opacity:.5; cursor:default; }
  #camera-btn{ background:var(--green); color:#fff; }
  #camera-btn:active{ background:var(--green-dark); }
  #upload-btn{ background:#eceae5; color:var(--ink); }
  #classify-btn{ background:var(--ink); color:#fff; width:100%; margin-top:10px; }
  input[type=file]{ display:none; }
  #result{ display:none; }
  #result.show{ display:block; }
  .result-badge{
    display:flex; align-items:center; gap:12px; padding:14px; border-radius:12px; color:#fff; margin-bottom:12px;
  }
  .swatch{ width:36px; height:36px; border-radius:50%; flex-shrink:0; border:3px solid rgba(255,255,255,.6); }
  .result-badge h2{ margin:0; font-size:1.05rem; }
  .result-badge p{ margin:2px 0 0; font-size:0.85rem; opacity:.9; }
  .cat-regular_trash{ background:var(--blue); } .cat-regular_trash .swatch{ background:#dbe9ff; }
  .cat-recycling{ background:var(--green); } .cat-recycling .swatch{ background:#d7f4e2; }
  .cat-bulky_pickup{ background:var(--amber); } .cat-bulky_pickup .swatch{ background:#ffe9c7; }
  .cat-hazardous_waste{ background:var(--red); } .cat-hazardous_waste .swatch{ background:#ffd9d3; }
  .cat-not_accepted{ background:var(--gray); } .cat-not_accepted .swatch{ background:#e4e6ea; }
  #instructions{ font-size:0.95rem; line-height:1.5; margin:0 0 8px; }
  #call-ahead{
    display:none; background:#fff4e0; border:1px solid #f0c987; color:#8f5a08;
    border-radius:10px; padding:10px 12px; font-size:0.88rem; margin-bottom:8px;
  }
  #call-ahead.show{ display:block; }
  #notes{ font-size:0.82rem; color:#777; margin:0; }
  #confidence{ font-size:0.78rem; color:#999; text-transform:uppercase; letter-spacing:.03em; margin:8px 0 0; }
  #error{
    display:none; background:#fdeceb; border:1px solid #f3c4bf; color:var(--red-dark);
    border-radius:10px; padding:12px; font-size:0.9rem; margin-bottom:14px;
  }
  #error.show{ display:block; }
  .spinner{
    width:18px; height:18px; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff;
    border-radius:50%; animation:spin .7s linear infinite; display:inline-block; vertical-align:-3px; margin-right:8px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  footer{ color:#9a9a9a; font-size:0.75rem; text-align:center; max-width:480px; margin-top:6px; }
  /* ---------- Tabs ---------- */
  .tabs{
    width:100%; max-width:480px; display:flex; gap:6px; padding:5px; margin-bottom:16px;
    background:#eceae5; border-radius:14px;
  }
  .tabs button{ background:transparent; color:#555; padding:11px 8px; font-size:0.95rem; border-radius:10px; }
  .tabs button[aria-selected="true"]{ background:var(--card); color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.12); }
  .panel{ width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; }
  .panel[hidden]{ display:none; }

  @media (prefers-color-scheme: dark){
    :root{ color-scheme: dark; }
    body{ background:#15171a; color:#f0f0ee; }
    .card{ background:#1e2124; border-color:#2c2f33; }
    #preview-wrap{ background:#2a2d31; border-color:#3a3d41; }
    #upload-btn{ background:#2a2d31; color:#f0f0ee; }
    header p, footer{ color:#8b8f94; }
    .tabs{ background:#2a2d31; }
    .tabs button{ color:#a5a9ae; }
    .tabs button[aria-selected="true"]{ background:#1e2124; color:#f0f0ee; }
  }
</style>
</head>
<body>
  <header>
    <h1>🗑️ OKC Trash Sorter</h1>
    <p>Snap a photo — we'll tell you which bin it goes in, per the City of OKC's rules.</p>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-sort" aria-controls="sort-panel" aria-selected="true">🗑️ Trash Sorter</button>
    <button type="button" role="tab" id="tab-game" aria-controls="game-panel" aria-selected="false">🎮 Games</button>
  </nav>

  <div class="panel" id="sort-panel" role="tabpanel" aria-labelledby="tab-sort">

  <div class="card">
    <div id="preview-wrap">
      <span id="preview-placeholder">No photo yet</span>
      <img id="preview" alt="Selected item" style="display:none" />
    </div>

    <div class="row">
      <button id="camera-btn" type="button">📷 Take Photo</button>
      <button id="upload-btn" type="button">🖼️ Choose Photo</button>
    </div>
    <input id="camera-input" type="file" accept="image/*" capture="environment" />
    <input id="file-input" type="file" accept="image/*" />

    <button id="classify-btn" type="button" disabled>Where does this go?</button>
  </div>

  <div id="error" class="card"></div>

  <div id="result" class="card">
    <div id="badge" class="result-badge">
      <div class="swatch"></div>
      <div>
        <h2 id="cat-label"></h2>
        <p id="item-name"></p>
      </div>
    </div>
    <p id="instructions"></p>
    <div id="call-ahead">📞 Call (405) 297-2833 in advance to schedule this pickup.</div>
    <p id="notes"></p>
    <p id="confidence"></p>
  </div>
  </div>

  <div class="panel" id="game-panel" role="tabpanel" aria-labelledby="tab-game" hidden></div>

  <footer>
    Rules sourced from okc.gov "What Goes Where." When in doubt, confirm with the City of Oklahoma City.
  </footer>

<script src="/game-data.js"></script>
<script src="/game.js"></script>
<script>
// Tabs: "Trash Sorter" (the photo classifier) and "Games".
// #game in the URL opens straight to the game.
function showTab(name){
  const game = name === 'game';
  document.getElementById('sort-panel').hidden = game;
  document.getElementById('game-panel').hidden = !game;
  document.getElementById('tab-sort').setAttribute('aria-selected', String(!game));
  document.getElementById('tab-game').setAttribute('aria-selected', String(game));
  if(!game) window.SortItGame.stop();
  history.replaceState(null, '', game ? '#game' : location.pathname);
}
document.getElementById('tab-sort').addEventListener('click', () => showTab('sort'));
document.getElementById('tab-game').addEventListener('click', () => showTab('game'));
if(location.hash === '#game') showTab('game');

const cameraBtn = document.getElementById('camera-btn');
const uploadBtn = document.getElementById('upload-btn');
const cameraInput = document.getElementById('camera-input');
const fileInput = document.getElementById('file-input');
const classifyBtn = document.getElementById('classify-btn');
const preview = document.getElementById('preview');
const placeholder = document.getElementById('preview-placeholder');
const resultEl = document.getElementById('result');
const errorEl = document.getElementById('error');

let currentFile = null;

cameraBtn.addEventListener('click', () => cameraInput.click());
uploadBtn.addEventListener('click', () => fileInput.click());
cameraInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

function handleFile(file){
  if(!file) return;
  currentFile = file;
  const url = URL.createObjectURL(file);
  preview.src = url;
  preview.style.display = 'block';
  placeholder.style.display = 'none';
  classifyBtn.disabled = false;
  resultEl.classList.remove('show');
  errorEl.classList.remove('show');
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result; // data:image/jpeg;base64,xxxx
      const base64 = result.split(',')[1];
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Phone camera photos can be several MB. Downscale + re-encode as JPEG
// client-side so uploads are fast and stay under the server's size limit.
function resizeImage(file, maxDim = 1280, quality = 0.82){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      canvas.toBlob((blob) => {
        if(!blob) return reject(new Error('Could not process that image.'));
        resolve(blob);
      }, 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that image.')); };
    img.src = url;
  });
}

const CATEGORY_LABELS = {
  regular_trash: 'Big Blue Cart — Regular Trash',
  recycling: 'Big Green Cart — Recycling',
  bulky_pickup: 'Bulky Waste — Needs Scheduling',
  hazardous_waste: 'Household Hazardous Waste — Drop-off Only',
  not_accepted: 'Not Accepted — Alternative Disposal',
};

classifyBtn.addEventListener('click', async () => {
  if(!currentFile) return;
  classifyBtn.disabled = true;
  classifyBtn.innerHTML = '<span class="spinner"></span>Checking…';
  errorEl.classList.remove('show');
  resultEl.classList.remove('show');

  try{
    const resized = await resizeImage(currentFile);
    const base64 = await fileToBase64(resized);
    const mediaType = 'image/jpeg';

    const res = await fetch('/api/classify', {
      method: 'POST',
      headers: {'content-type':'application/json'},
      body: JSON.stringify({ imageBase64: base64, mediaType })
    });
    const data = await res.json();

    if(!res.ok){
      throw new Error(data.error || 'Something went wrong.');
    }

    renderResult(data);
  }catch(err){
    errorEl.textContent = err.message || 'Something went wrong. Try again.';
    errorEl.classList.add('show');
  }finally{
    classifyBtn.disabled = false;
    classifyBtn.textContent = 'Where does this go?';
  }
});

function renderResult(data){
  const badge = document.getElementById('badge');
  badge.className = 'result-badge cat-' + (data.category || 'not_accepted');
  document.getElementById('cat-label').textContent = data.categoryLabel || CATEGORY_LABELS[data.category] || 'Unknown';
  document.getElementById('item-name').textContent = data.item ? ('Identified as: ' + data.item) : '';
  document.getElementById('instructions').textContent = data.instructions || '';
  document.getElementById('call-ahead').classList.toggle('show', !!data.callAhead);
  const notesEl = document.getElementById('notes');
  notesEl.textContent = data.notes || '';
  notesEl.style.display = data.notes ? 'block' : 'none';
  document.getElementById('confidence').textContent = data.confidence ? ('Confidence: ' + data.confidence) : '';
  resultEl.classList.add('show');
  resultEl.scrollIntoView({behavior:'smooth', block:'nearest'});
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
