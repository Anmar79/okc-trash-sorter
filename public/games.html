<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14532d" />
<title>OKC Sort Games</title>
<meta name="description" content="Play and learn where Oklahoma City's trash goes: Conveyor Rush, Daily Challenge, Swipe It, Bin Catcher, Photo Hunt and Learn Mode." />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" />
<link rel="stylesheet" href="/game.css" />
<style>
  /* Page chrome matching the OKC Sort app (cream background, deep green). */
  :root{ --paper:#faf7f0; --ink:#0f2a1d; --muted:#5f6b63; --brand:#14532d; --line:#e7e2d6; color-scheme: light; }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#111614; --ink:#eef2ef; --muted:#9aa69f; --line:#26302b; color-scheme: dark; }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  header{ width:100%; max-width:480px; display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .logo{ width:52px; height:52px; border-radius:50%; background:var(--brand); color:#fff; display:grid; place-items:center; font-size:1.6rem; flex-shrink:0; box-shadow:0 0 0 3px #fff, 0 0 0 4px var(--line); }
  header h1{ margin:0; font-size:1.35rem; letter-spacing:-.01em; }
  header p{ margin:2px 0 0; color:var(--muted); font-size:.9rem; }
  header a{ margin-left:auto; color:var(--brand); font-weight:600; font-size:.9rem; text-decoration:none; white-space:nowrap; }
  @media (prefers-color-scheme: dark){ header a{ color:#86efac; } }
  #game-panel{ width:100%; max-width:480px; }
  footer{ color:var(--muted); font-size:.75rem; text-align:center; max-width:480px; margin-top:14px; line-height:1.5; }
  /* ?embed=1 hides the page header when shown inside the OKC Sort app. */
  body.embed header{ display:none; }
</style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">♻️</div>
    <div>
      <h1>OKC Sort</h1>
      <p>Games</p>
    </div>
    <a id="back-link" href="https://okc-sort.anmar-alsaadi.chatgpt.site/">← Back to app</a>
  </header>

  <div id="game-panel"></div>

  <footer>Rules from the City of Oklahoma City's "What Goes Where" guide. Always use the official OKC guide for hazardous or unclear items.</footer>

<script>
  if(new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
</script>
<script src="/game-data.js"></script>
<script src="/game.js"></script>
<script src="/minigames.js"></script>
</body>
</html>
